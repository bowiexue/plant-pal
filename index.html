<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Plant Pal Mega Edition</title>
</head>
<body>
  <div class="bx">
    <h4 style="margin:0 0 5px 0; font-size:16px;">SproutPal Pro Mega 🌿</h4>
    
    <!-- Weather Widget Display Box -->
    <div id="wdg" class="sl" style="background:#e8f1f5;border-color:#b0c4de;margin-bottom:4px;">
      <div class="sl-row" style="font-weight:bold;">
        <span>Palo Alto, CA 📍</span>
        <span id="wdg-temp">73°F</span>
      </div>
      <div class="sl-row">
        <span id="wdg-time">12:00:00 PM</span>
        <span id="wdg-cond">☁️ Mostly Cloudy</span>
      </div>
    </div>

    <!-- MAIN MIDDLE GRID: Canvas Left, Controls Right -->
    <div class="mid-row">
      <div class="cv-wrap">
        <canvas id="cv" width="144" height="144"></canvas>
      </div>
      
      <div class="side-ctrls">
        <div id="st" class="st"></div>
        <div id="tmbx" class="tm-box mode-focus">
          <div id="tm" class="tm">25:00</div>
        </div>
        <div class="bt">
          <button id="go" onclick="run()">Start</button>
          <button onclick="reset()">Reset</button>
        </div>
      </div>
    </div>
    
    <!-- DYNAMIC STICKER & TEXT STYLE SECTION -->
    <div class="sl" style="background:#fff3e0; border-color:#ffe0b2;">
      <div style="font-size:11px; font-weight:bold; color:#e65100; margin-bottom:4px;">✨ Plant Theme Stickers & Text Fonts (Click to Copy):</div>
      <div class="stk-row" id="stk-box"></div>
      <div class="fnt-col" id="fnt-box"></div>
    </div>
    
    <!-- Music Synth Interface -->
    <div class="mu-box">
      <div style="display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:11px;font-weight:bold;">
        <span>Mood Synth:</span>
        <select id="mtype">
          <option value="chill">Cozy Vinyl Pad</option>
          <option value="jazz">Warm Melancholy</option>
          <option value="rain">Soft Rainy Beats</option>
          <option value="cosmic">Deep Space Drone</option>
          <option value="retro">Chiptune Focus</option>
        </select>
      </div>
      <button id="m" class="mu" onclick="tune()">🎵 Synthesize Music</button>
    </div>

    <!-- Dials and Selection Panels -->
    <div class="sl">
      <div class="sl-row">
        <span>Plant Type:</span>
        <select id="pt" onchange="chg()">
          <option value="sprout">Thick Sprout</option>
          <option value="cactus">Big Cactus</option>
          <option value="flower">Sunflower</option>
          <option value="orchid">Exotic Orchid</option>
          <option value="sakura">Sakura Bonsai</option>
          <option value="fern">Cozy Fern</option>
          <option value="bamboo">Lucky Bamboo</option>
          <option value="rose">Crimson Rose</option>
          <option value="maple">Mini Maple</option>
          <option value="mushroom">Shroom Patch</option>
        </select>
      </div>
      <div class="sl-row">
        <span>Timer Mode:</span>
        <select id="tmode" onchange="setMode()">
          <option value="focus">Focus Session</option>
          <option value="break">Break Time</option>
        </select>
      </div>
      <div class="sl-row">
        <span>Custom Mins:</span>
        <input type="number" id="cust" value="25" min="1" max="180" onchange="applyCustomTime()">
      </div>
    </div>
    
    <div class="an-box">🐾 Unique Visitor:<div id="an" class="pt-c"></div></div>
    
    <!-- Tasks and History Log Displays -->
    <div class="td">
      <div class="rw">
        <input type="text" id="in" placeholder="Task..."><button onclick="add()">Add</button>
      </div>
      <ul id="el"></ul>
    </div>
    
    <div class="td" style="border-top:1px dashed #aaa;padding-top:4px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
        <span style="font-size:10px;font-weight:bold;color:#666;">📜 Completed History Log:</span>
        <button onclick="clearHist()" style="background:#ff6b6b;font-size:9px;padding:1px 5px;height:16px;line-height:1;">Clear</button>
      </div>
      <ul id="hist-log" style="max-height:45px;opacity:0.8;"></ul>
    </div>
  </div>
</body>
</html>
<style>
  :root{--bg:#f4f9f4;--c:#fff;--p:#52b788;--pd:#2d6a4f;--ac:#d8f3dc;--t:#2f3e46;}
  *{box-sizing:border-box;}
  body{font-family:monospace;background:var(--bg);color:var(--t);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:5px;}
  
  .bx{background:var(--c);padding:15px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.1);width:620px;text-align:center;display:flex;flex-direction:column;gap:8px;}
  
  .mid-row{display:flex;gap:15px;align-items:center;justify-content:space-between;width:100%;}
  .cv-wrap{width:180px;height:180px;background:var(--ac);border-radius:8px;display:flex;justify-content:center;align-items:center;flex-shrink:0;}
  .side-ctrls{display:flex;flex-direction:column;gap:8px;flex:1;justify-content:center;}
  
  .stk-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
  .stk-btn{background:#fff;border:1px solid #ffcc80;padding:4px 8px;font-size:11px;border-radius:20px;cursor:pointer;font-weight:bold;}
  .stk-btn:hover{background:#fff3e0;}
  .fnt-col{display:flex;flex-direction:column;gap:4px;text-align:left;}
  .fnt-row{display:flex;justify-content:space-between;background:#fff;padding:4px 8px;border-radius:4px;border:1px solid #ffe0b2;font-size:11px;cursor:pointer;}
  .fnt-row:hover{background:#fff3e0;}

  canvas{background:var(--ac);image-rendering:pixelated;width:160px;height:160px;}
  .st{font-size:11px;font-weight:bold;color:var(--pd);min-height:22px;display:flex;align-items:center;justify-content:center;}
  .tm-box{background:#f8f9fa;padding:6px;border-radius:6px;border:1px solid #e9ecef;}
  .tm{font-size:32px;font-weight:bold;margin:0;}
  .bt{display:flex;gap:6px;justify-content:center;}
  button{background:var(--p);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:bold;font-family:monospace;font-size:12px;}
  button:hover{background:var(--pd);}
  .mu-box{background:#457b9d;padding:6px;border-radius:6px;display:flex;flex-direction:column;gap:4px;}
  .mu-box span,.mu-box select,.mu-box button{color:#fff;font-family:monospace;font-size:11px;}
  .mu-box select{background:#1d3557;border:1px solid #fff;border-radius:4px;padding:2px;}
  .mu{background:#1d3557;width:100%;margin-top:2px;padding:5px;}
  .sl{font-size:11px;font-weight:bold;display:flex;flex-direction:column;gap:4px;text-align:left;background:#f8f9fa;padding:6px;border-radius:6px;border:1px solid #e9ecef;}
  .sl-row{display:flex;justify-content:space-between;align-items:center;}
  select,input[type="number"]{font-family:monospace;font-size:11px;border-radius:4px;border:1px solid #ccc;padding:2px 4px;}
  input[type="number"]{width:50px;}
  .an-box{background:#f8f9fa;padding:4px;border-radius:6px;font-size:11px;font-weight:bold;text-align:left;height:45px;position:relative;border:1px solid #e9ecef;}
  .pt-c{position:absolute;bottom:0;left:0;width:100%;height:28px;}
  .pet{position:absolute;font-size:18px;bottom:2px;transition:left 0.4s,bottom 0.2s;line-height:1;}
  .td{text-align:left;border-top:1px dashed #ccc;padding-top:6px;display:flex;flex-direction:column;gap:4px;}
  .rw{display:flex;gap:4px;}
  input[type="text"]{flex:1;padding:5px;border:1px solid #ccc;border-radius:4px;font-family:monospace;font-size:11px;}
  ul{list-style:none;padding:0;margin:0;max-height:75px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  li{display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:3px;background:#fdfdfd;border:1px solid #f0f0f0;border-radius:4px;}
  li label{display:flex;align-items:center;gap:4px;cursor:pointer;flex:1;overflow:hidden;}
  .dn span{text-decoration:line-through;color:#888;}
  .dl{background:none;color:#ff6b6b;padding:0 4px;}
  .mode-focus{border-left:4px solid var(--p);}
  .mode-break{border-left:4px solid #457b9d;}
</style>
<script>
  var cv=document.getElementById('cv'),cx=cv.getContext('2d'),pts=0,sleep=false,act=Date.now(),time=1500,mId=null,on=false,list=[],historyLog=[],kind="sprout",aCtx=null,synthId=null,play=false,beat=0,pets=[],lockGrowth=false;
  
  var plantPets={"sprout":"🐰","cactus":"🐪","flower":"🐝","orchid":"🦚","sakura":"🦊","fern":"🦌","bamboo":"🐼","rose":"🦋","maple":"🐿️","mushroom":"🐸"};

  var themeStickers = {
    "sprout": { text: ["(🌱•ᴗ•🌱)", "(っˆڡˆς)🌱", "✧sprout✧"], styles: ["𝔖𝔭𝔯𝔬𝔲𝔱 𝔓𝔞𝔩", "𝓼𝓿𝓻𝓸𝓾𝓽 𝓿𝓪𝓵", "ｓｐｒｏｕｔ  ｐａｌ"] },
    "cactus": { text: ["🌵(•‿•)🌵", "(>_<)凸", "✧prickly✧"], styles: ["ℭ𝔞𝔠𝔱𝔲𝔰 𝔏𝔦𝔣𝔢", "𝓬𝓪𝓬𝓽𝓾𝓼 𝓵𝓲𝓯𝓮", "ｃａｃｔｕｓ  ｌｉｆｅ"] },
    "flower": { text: ["(🌸◠‿◠)", "(*✿‿✿)", "✧sunny✧"], styles: ["𝔉𝔩𝔬𝔴𝔢𝔯 𝔓𝔬𝔴𝔢𝔯", "𝓯𝓵𝓸𝔀𝓮𝓻 𝓿𝓸𝔀𝓮𝓻", "ｆｌｏｗｅｒ  ｐｏｗｅｒ"] },
    "orchid": { text: ["(｡♥‿♥｡)🔮", "(◕‿◕✿)", "✧exotic✧"], styles: ["𝔒放𝔠𝔥𝔦𝔡 𝔑𝔤𝔥𝔱", "𝓸𝓻𝓬𝓿𝓲𝓭 𝓷𝓲𝓰𝓿𝓽", "ｏｒｃｈｉｄ  ｎｉｇｈｔ"] },
    "sakura": { text: ["(💮◡💮)", "(｡✿‿✿｡)", "✧bonsai✧"], styles: ["𝔖𝔞𝔨𝔲𝔯𝔞 𝔅𝔩𝔬𝔬𝔪", "𝓼𝓪𝓴𝓾𝓻𝓪 𝓫𝓵𝓸𝓸𝓶", "ｓａｋｕｒａ  ｂｌｏｏｍ"] },
    "fern": { text: ["🌿(ᵕ‿ᵕ)🌿", "(๑˃̵ᴗ˂̵)🍃", "✧cozy✧"], styles: ["𝔉𝔢𝔯𝔫 𝔊𝔯𝔬𝔳𝔢", "𝓯𝓿举行 𝓰𝓻𝓸𝓿𝓮", "ｆｅｒｎ  ｇｒｏｖｅ"] },
    "bamboo": { text: ["🎍(•_•)🎍", "(ᵔᴥᵔ)🐼", "✧lucky✧"], styles: ["𝔅𝔞𝔨𝔟𝔬𝔬 ℭ𝔥准𝔭", "𝓫𝓪bam𝓫𝓸𝓸 𝓬𝓿𝓸𝓿", "ｂａｍｂｏｏ  ｃｈｏｐ"] },
    "rose": { text: ["🌹(♨_♨)", "(✿ ♥‿♥)", "✧crimson✧"], styles: ["𝔖𝔠𝔞𝔯𝔩𝔢𝒕 ℜ𝔬𝔰𝔢", "𝓼𝓬𝓪𝓻𝓵𝒆𝓽 𝓻𝓸𝓼𝒆", "ｓｃａｒｌｅｔ  ｒｏｓｅ"] },
    "maple": { text: ["🍁(👁️_👁️)", "ﾍ(￣▽￣*)🍁", "✧autumn✧"], styles: ["𝔐𝔞𝔭𝔩𝔢 𝔏𝔢𝔞𝔣", "𝓶𝓪𝓿 Maple 𝓵𝓿𝓪𝓯", "ｍａｐｌｅ  ｌｅａｆ"] },
    "mushroom": { text: ["🍄(𖦹_𖦹)🍄", "(•͈ᴗ•͈)🍄", "✧shroom✧"], styles: ["𝔉𝔲𝔫𝔄𝔦 𝔉𝔬𝔯𝔢𝔰𝔱", "𝓯𝓾𝓷𝓰𝓲 𝓯𝓸𝓻𝒆𝓼𝓽", "ｆｕｎｇｉ  ｆｏｒｅｓｔ"] }
  };

  function copyText(val) {
    navigator.clipboard.writeText(val);
    alert("📋 Copied Sticker: " + val);
  }

  function updateStickers() {
    var data = themeStickers[kind];
    var sBox = document.getElementById('stk-box');
    var fBox = document.getElementById('fnt-box');
    var sOut = [];
    for(var i=0; i<data.text.length; i++) {
      sOut.push('<button class="stk-btn" onclick="copyText(\''+data.text[i]+'\')">'+data.text[i]+'</button>');
    }
    sBox.innerHTML = sOut.join('');
    var fOut = [];
    for(var j=0; j<data.styles.length; j++) {
      fOut.push('<div class="fnt-row" onclick="copyText(\''+data.styles[j]+'\')"><span>'+data.styles[j]+'</span><span style="color:#aaa; font-size:9px;">click to copy</span></div>');
    }
    fBox.innerHTML = fOut.join('');
  }

  if(localStorage.getItem('p_hist')){try{historyLog=JSON.parse(localStorage.getItem('p_hist'));}catch(e){}}

  setInterval(function(){
    var d=new Date();
    document.getElementById('wdg-time').innerText=d.toLocaleTimeString()+' ('+d.toLocaleDateString()+')';
  },1000);

  setInterval(function(){if(!on&&Date.now()-act>600000){sleep=true;msg();draw();}},10000);
  function tch(){act=Date.now();sleep=false;msg();}
  function lvl(){return pts(0)>=9?3:pts>=6?2:pts>=3?1:0;}
  
  function setMode(){
    var m=document.getElementById('tmode').value,b=document.getElementById('tmbx');
    if(m=="focus"){b.className="tm-box mode-focus";document.getElementById('cust').value="25";}
    else{b.className="tm-box mode-break";document.getElementById('cust').value="5";}
    applyCustomTime();
  }
  function applyCustomTime(){clearInterval(mId);on=false;document.getElementById('go').innerText="Start";time=parseInt(document.getElementById('cust').value)*60;show();}
  function run(){
    tch();var b=document.getElementById('go');
    if(on){clearInterval(mId);on=false;b.innerText="Start";}
    else{on=true;b.innerText="Pause";mId=setInterval(function(){if(time>0){time--;show();}else{reset();var m=document.getElementById('tmode').value;if(m=="focus"){pts+=3;alert("Focus session complete!");}else{alert("Break over!");}tch();draw();checkWin();}},1000);}
  }
  function reset(){clearInterval(mId);on=false;var m=document.getElementById('tmode').value;time=(m=="focus"?25:5)*60;document.getElementById('cust').value=m=="focus"?"25":"5";document.getElementById('go').innerText="Start";show();}
  function show(){var m=Math.floor(time/60),s=time%60;document.getElementById('tm').innerText=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
  function add(){var i=document.getElementById('in'),v=i.value.trim();if(!v)return;list.push({t:v,d:false});i.value='';ren();tch();}
  
  window.hF=function(el){
    if(lockGrowth)return;var x=parseInt(el.getAttribute('data-i'));list[x].d=!list[x].d;
    if(list[x].d){
      pts++;var timestamp=new Date().toLocaleTimeString();
      historyLog.unshift(list[x].t+' ['+timestamp+']');
      localStorage.setItem('p_hist',JSON.stringify(historyLog));
    }else{if(pts>0)pts--;}
    ren();tch();draw();checkWin();
  };
  
  window.hR=function(el){if(lockGrowth)return;var x=parseInt(el.getAttribute('data-i'));if(list[x].d&&pts>0)pts--;list.splice(x,1);ren();tch();draw();};
  function clearHist(){historyLog=[];localStorage.removeItem('p_hist');ren();}
  
  function ren(){
    var out=[];for(var i=0;i<list.length;i++){var item=list[i],cls=item.d?' class="dn"':'',chk=item.d?' checked':'';out.push('<li'+cls+'><label><input type="checkbox"'+chk+' data-i="'+i+'" onclick="window.hF(this)"><span>'+item.t+'</span></label><button class="dl" data-i="'+i+'" onclick="window.hR(this)">X</button></li>');}
    document.getElementById('el').innerHTML=out.join('');
    var hOut=[];for(var j=0;j<historyLog.length;j++){hOut.push('<li style="color:#666;">✓ '+historyLog[j]+'</li>');}
    document.getElementById('hist-log').innerHTML=hOut.join('');
    msg();
  }
</script>
<script>
  function tune(){
    var b=document.getElementById('m'),mt=document.getElementById('mtype').value;
    try{
      if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();
      if(play){clearInterval(synthId);play=false;b.innerText="🎵 Synthesize Music";}
      else{
        play=true;b.innerText="⏸️ Stop Beats";
        synthId=setInterval(function(){
          var nw=aCtx.currentTime;
          if(mt=="chill"){
            var f=130.81+((beat)%4)*20,o=aCtx.createOscillator(),g=aCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,nw);o.connect(g);g.connect(aCtx.destination);g.gain.setValueAtTime(0.015,nw);g.gain.exponentialRampToValueAtTime(0.001,nw+1.8);o.start(nw);o.stop(nw+1.8);
          }else if(mt=="jazz"){
            var chords=[146.83,164.81,196.00,220.00],f=chords[beat%chords.length];var o=aCtx.createOscillator(),g=aCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f,nw);o.connect(g);g.connect(aCtx.destination);g.gain.setValueAtTime(0.02,nw);g.gain.exponentialRampToValueAtTime(0.001,nw+2.5);o.start(nw);o.stop(nw+2.5);
          }else if(mt=="rain"){
            var o=aCtx.createOscillator(),g=aCtx.createGain();o.frequency.setValueAtTime(55+Math.random()*10,nw);o.connect(g);g.connect(aCtx.destination);g.gain.setValueAtTime(0.01,nw);g.gain.exponentialRampToValueAtTime(0.001,nw+0.12);o.start(nw);o.stop(nw+0.12);
          }else if(mt=="cosmic"){
            var f=73.42+Math.sin(beat*0.2)*5,o=aCtx.createOscillator(),g=aCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f,nw);o.connect(g);g.connect(aCtx.destination);g.gain.setValueAtTime(0.025,nw);g.gain.exponentialRampToValueAtTime(0.001,nw+3);o.start(nw);o.stop(nw+3);
          }else if(mt=="retro"){
            var notes=[261.63,329.63,392.00,523.25],f=notes[beat%notes.length];var o=aCtx.createOscillator(),g=aCtx.createGain();o.type='square';o.frequency.setValueAtTime(f,nw);o.connect(g);g.connect(aCtx.destination);g.gain.setValueAtTime(0.008,nw);g.gain.exponentialRampToValueAtTime(0.001,nw+0.4);o.start(nw);o.stop(nw+0.4);
          }beat++;
        },mt=="rain"?120:mt=="retro"?250:900);
      }
    }catch(e){b.innerText="⚠️ Audio Lock";}
  }
  function chg(){
    if(lockGrowth)return;kind=document.getElementById('pt').value;var b="#f4f9f4",c="#d8f3dc";
    if(kind=="cactus"||kind=="rose"){b="#fdf0d5";c="#fcd5a1";}else if(kind=="flower"||kind=="mushroom"){b="#fffbfa";c="#fef1d2";}else if(kind=="orchid"||kind=="maple"){b="#1a1a2e";c="#16213e";}else if(kind=="bamboo"||kind=="fern"){b="#f0f7f4";c="#cdeac0";}
    document.body.style.background=b;cv.style.background=c;tch();updateStickers();draw();
  }
  function checkWin(){
    var currentAnimal=plantPets[kind];
    if(pts&&pts%9===0&&!lockGrowth){
      lockGrowth=true;var d=new Date(),stamp=d.toLocaleDateString()+' @ '+d.toLocaleTimeString();
      var e=document.createElement('div');e.className='pet';e.innerText=currentAnimal;e.style.left=Math.random()*450+'px';document.getElementById('an').appendChild(e);
      pets.push({dom:e,x:parseFloat(e.style.left),tx:parseFloat(e.style.left),ani:currentAnimal});
      setTimeout(function(){
        if(confirm("🎉 Plant fully grown! Unlocked: "+currentAnimal+" on "+stamp+"!\n\nReady to reset the checklist and plant a new seed?")){pts=0;list=[];}
        lockGrowth=false;ren();draw();
      },7000);
    }
  }
  setInterval(function(){for(var i=0; i<pets.length;i++){var p=pets[i];if(Math.random()<0.2)p.tx=Math.random()*450;if(Math.abs(p.x-p.tx)>2){p.x+=p.tx>p.x?2:-2;p.dom.style.bottom=(Math.sin(p.x*0.1)*4+2)+'px';}p.dom.style.left=p.x+'px';}},80);
  function msg(){
    var l=pts>=9?3:pts>=6?2:pts>=3?1:0,n=Math.max(0,9-pts),t="Needs "+n+" checks to fully grow!";
    if(lockGrowth)t="✨ Admiring growth! Reset prompt loading...";
    else if(sleep)t="Zzz... Pal is sleepy from neglect!";else if(l==1)t="Strong sprout! ("+n+" left)";else if(l==2)t="Thick and growing! ("+n+" left)";else if(l==3||pts>=9)t="Grand size! Unlocked its special pet!";
    document.getElementById('st').innerText=t;
  }
  function pxl(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x*9,y*9,w*9,h*9);}
  function draw(){
