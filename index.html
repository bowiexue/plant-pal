<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>SproutOS Dashboard</title>
  <style>
    :root { --card-bg: #fff; --p: #52b788; --pd: #2d6a4f; --ac: #d8f3dc; --border: 3px solid #222; }
    * { box-sizing: border-box; font-family: monospace; font-size: 12px; }
    body { background: #f0f4f1; margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
    .meta-row { display: flex; justify-content: space-between; font-weight: bold; background: #e2e8f0; padding: 6px; border-radius: 12px; border: var(--border); margin-bottom: 16px; }
    .dashboard-title { font-size: 18px; font-weight: bold; color: var(--pd); margin-bottom: 20px; border-bottom: var(--border); padding-bottom: 8px; }
    .dashboard-grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .chunky-widget { background: var(--card-bg); border: var(--border); border-radius: 16px; padding: 16px; box-shadow: 6px 6px 0px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 12px; }
    .wide-widget { flex: 2; min-width: 340px; }
    .narrow-widget { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 20px; }
    .widget-header { font-size: 14px; font-weight: bold; border-bottom: 2px solid #222; padding-bottom: 6px; display: flex; justify-content: space-between; }
    .plant-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .cv-wrap { width: 144px; height: 144px; background: var(--ac); border-radius: 12px; display: flex; justify-content: center; align-items: center; border: 2px solid #222; }
    canvas { background: var(--ac); image-rendering: pixelated; }
    .side-ctrls { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 140px; }
    .tm-box { background: #fafafa; padding: 8px; border-radius: 8px; border: 2px solid #222; text-align: center; }
    .tm { font-size: 26px; font-weight: bold; color: var(--pd); }
    .btn-grid { display: flex; gap: 6px; width: 100%; }
    button { background: var(--p); border: 2px solid #222; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 2px 2px 0px #000; }
    .tgl-btn { background: #cbd5e1; color: #334155; }
    .tgl-btn.active-focus { background: #2d6a4f !important; color: #fff !important; }
    .tgl-btn.active-break { background: #475569 !important; color: #fff !important; }
    .tgl-btn.active-len { background: #52b788 !important; color: #000 !important; }
    .rw { display: flex; gap: 6px; margin-bottom: 8px; }
    input[type="text"], select { width: 100%; padding: 6px; border-radius: 8px; border: 2px solid #222; font-weight: bold; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 6px; background: #fafafa; border: 2px solid #222; border-radius: 8px; word-break: break-word; }
    .dn span { text-decoration: line-through; color: #888; }
    .dl { background: none; color: #ef4444; border: none; padding: 0 4px; cursor: pointer; }
    .an-box { background: #fafafa; padding: 8px; border-radius: 12px; font-weight: bold; position: relative; border: 2px solid #222; height: 48px; overflow: hidden; }
    .pt-c { position: absolute; bottom: 0; left: 0; width: 100%; height: 24px; }
    .pet { position: absolute; font-size: 16px; bottom: 2px; transition: left 0.4s; }
    .stk-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 0; max-height: 140px; overflow-y: auto; }
    .stk-btn { background: #fff; border: 2px solid #222; padding: 6px 10px; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 2px 2px 0px #000; }
    .fnt-col { display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; }
    .fnt-row { display: flex; justify-content: space-between; background: #fff; padding: 6px; border-radius: 6px; border: 2px solid #222; font-weight: bold; cursor: pointer; word-break: break-all; }
    .mu-box { background: #457b9d; border: 2px solid #222; border-radius: 12px; padding: 14px; color: #fff; }
    .mu-box select { background: #1d3557; color: #fff; margin-bottom: 8px; }
    .mu { background: #1d3557; width: 100%; color: #fff; border: 2px solid #222; }
    .pz { background: #fff; border: 2px dashed #ab47bc; border-radius: 12px; min-height: 110px; flex: 1; display: flex; align-items: center; justify-content: center; color: #7b1fa2; font-style: italic; }
    .history-item { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #cbd5e1; font-weight: bold; color: #475569; word-break: break-word; white-space: normal; }
    .toggle-row { display: flex; gap: 8px; align-items: center; background: #f8fafc; padding: 6px; border-radius: 8px; border: 2px solid #cbd5e1; margin-bottom: 6px; }
    .inner-box-nest { background: #fafafa; border: 2px solid #222; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; flex: 1; }
    #eco-desc { font-style: italic; font-size: 11px; word-break: break-word; white-space: normal; }
  </style>
</head>
<body>
  <div class="meta-row"><span>🌿 SproutOS Node</span><span id="live-system-clock">00:00:00</span></div>
  <div class="dashboard-title">🌿 Personal Space Engine</div>
  <div class="dashboard-grid">
    <!-- CORES CONTAINER -->
    <div class="chunky-widget wide-widget">
      <div class="widget-header"><span style="color: #2d6a4f;">🌿 Garden Matrix</span><span id="st">Loading...</span></div>
      <div class="plant-row">
        <div class="cv-wrap"><canvas id="cv" width="144" height="144"></canvas></div>
        <div class="side-ctrls">
          <div class="tm-box"><div id="tm" class="tm">25:00</div></div>
          <div class="btn-grid">
            <button id="mode-focus" onclick="setTimerMode('focus')" class="tgl-btn active-focus" style="flex:1; padding:4px; font-size:10px;">🎯 Focus</button>
            <button id="mode-break" onclick="setTimerMode('break')" class="tgl-btn" style="flex:1; padding:4px; font-size:10px;">☕ Break</button>
          </div>
          <div class="btn-grid">
            <button id="len-short" onclick="setTimerLength('short')" class="tgl-btn" style="flex:1; padding:4px; font-size:10px;">⏱️ Short</button>
            <button id="len-long" onclick="setTimerLength('long')" class="tgl-btn active-len" style="flex:1; padding:4px; font-size:10px;">⏱️ Long</button>
          </div>
          <div class="btn-grid"><button id="go" onclick="run()" style="flex:1; background:#52b788;">Start</button><button onclick="reset()" style="flex:1; background:#e2e8f0;">Reset</button></div>
          <select id="pt" onchange="chg()" style="margin-top:4px;">
            <option value="sprout">🌿 Sprout</option><option value="cactus">🌵 Cactus</option><option value="flower">🌻 Sunflower</option>
          </select>
        </div>
      </div>
      <div style="margin-top:8px;">
        <div class="rw"><input type="text" id="in" placeholder="Task..." onkeydown="if(event.key==='Enter')add()"><button onclick="add()">Add</button></div>
        <ul id="el"></ul>
      </div>
      <div class="an-box">🐾 Sanctuary: <div id="an" class="pt-c"></div></div>
      <div class="chunky-widget" style="background:#eaf4f4; padding:8px; box-shadow:none; border-width:2px;"><div id="eco-desc">Loading...</div></div>
    </div>
    <!-- SIDE PANEL -->
    <div class="narrow-widget">
      <div class="chunky-widget" style="box-shadow:none; flex:1;">
        <div class="widget-header"><span style="color:#03045e;">🐹 Hamster Wheel</span><span id="hamster-status">IDLE</span></div>
        <canvas id="hamsterCanvas" width="128" height="128" style="border:2px solid #222; border-radius:12px; margin:0 auto;"></canvas>
        <div style="text-align:center;">
          <div style="font-weight:bold;">Chore: <span id="chore-time">0m</span> / <span id="chore-target-display">15m</span></div>
          <button onclick="triggerChoreBoost()" style="background:#03045e; color:#fff; width:100%; margin-top:4px;">🧹 Log 15m Chore</button>
        </div>
        <div class="inner-box-nest">
          <div id="playzone" class="pz">Hover for sparkles! Click to hatch.</div>
        </div>
      </div>
    </div>
    <!-- SYSTEM MONITOR -->
    <div class="narrow-widget">
      <div class="chunky-widget" style="box-shadow:none; flex:1;">
        <div class="widget-header"><span style="color:#1d3557;">🎵 Audio Core</span></div>
        <div class="mu-box">
          <select id="mtype"><option value="chill">Vinyl</option><option value="jazz">Melancholy</option></select>
          <button id="m" class="mu" onclick="tune()">🔊 Start Audio</button>
        </div>
        <div class="inner-box-nest" style="min-height:160px;">
          <div id="workspace-history-box" style="height:130px; overflow-y:scroll;"></div>
        </div>
      </div>
    </div>
    <!-- TRANSFORMER ROW -->
    <div class="chunky-widget wide-widget" style="min-width:100%;">
      <div class="widget-header"><span style="color:#e65100;">🔤 Font Engine</span></div>
      <div style="display:flex; gap:16px; flex-wrap:wrap; width:100%;">
        <div class="chunky-widget" style="background:#fff3e0; box-shadow:none; flex:1; min-width:240px;"><div class="stk-row" id="stk-box"></div></div>
        <div class="chunky-widget" style="background:#e0f2f1; box-shadow:none; flex:1; min-width:240px;">
          <input type="text" id="cust-txt-in" value="Plant Pal" oninput="genFonts()">
          <div class="fnt-col" id="fnt-box"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="database.js"></script><script src="engine.js"></script>
</body>
</html>
