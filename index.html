<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plant Pal Master Hub</title>
  <style>
    body {
      background: #f4f9f4;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .launch-box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
      border: 2px solid #52b788;
    }
    .launch-btn {
      background: #52b788;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-family: monospace;
      box-shadow: 0 4px 0 #2d6a4f;
      transition: all 0.1s ease;
    }
    .launch-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #2d6a4f;
    }
    h3 { margin-top: 0; color: #2d6a4f; }
    p { color: #555; font-size: 11px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="launch-box">
    <h3>SproutPal Pro Master Suite 🌿</h3>
    <p>Launches your phone-widget desktop tracker sandbox into a dedicated standalone canvas page.</p>
    <button class="launch-btn" onclick="location.href='dashboard.html'">🚀 Open Workspace Dashboard</button>
  </div>

</body>
</html>
