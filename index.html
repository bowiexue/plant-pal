<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SproutOS Smartphone Deck</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:#f0f3f5; font-family:monospace; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
    .phone-container { width:360px; height:740px; background:#111; border:12px solid #222; border-radius:40px; box-shadow:0 12px 32px rgba(0,0,0,0.25); position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .phone-status-bar { height:24px; background:#000; color:#fff; font-size:10px; display:flex; justify-content:space-between; align-items:center; padding:0 20px; font-weight:bold; }
    .phone-screen { flex:1; background:#f4f9f4; position:relative; display:flex; flex-direction:column; overflow-y:auto; padding:15px; }
    .phone-home-bar { height:24px; background:#f4f9f4; display:flex; justify-content:center; align-items:center; cursor:pointer; padding-bottom:4px; border-top:1px solid #eee; }
    .home-pill { width:100px; height:5px; background:#888; border-radius:10px; }
  </style>
</head>
<body>
  <div class="phone-container">
    <div class="phone-status-bar">
      <span id="os-clock">12:00 PM</span><span style="font-size:8px;">SproutOS 📶 🔋 100%</span>
    </div>
    <div class="phone-screen" id="screen-viewport">
      <!-- SYSTEM VIEWPORT INSERTION NODE -->
      <div id="app-view-target"></div>
    </div>
    <div class="phone-home-bar" onclick="returnToHome()"><div class="home-pill"></div></div>
  </div>
  <script src="database.js"></script>
  <script src="audio.js"></script>
  <script src="engine.js"></script>
  <script src="playground.js"></script>
  <script src="hamster.js"></script>
  <script src="app-layouts.js"></script>
</body>
</html>
